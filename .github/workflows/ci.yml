name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  build-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.2
        env: { POSTGRES_USER: finbank, POSTGRES_PASSWORD: finbank, POSTGRES_DB: finbank_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finbank" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://finbank:finbank@localhost:5432/finbank_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.19.2, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
