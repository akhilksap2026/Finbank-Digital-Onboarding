# FinBank digital account opening — on-premises stack (Postgres + API serving the PWA).
services:
  db:
    image: postgres:17.2-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: finbank
      POSTGRES_USER: finbank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U finbank -d finbank"], interval: 5s, timeout: 3s, retries: 20 }
  app:
    build: { context: .., dockerfile: deploy/Dockerfile }
    image: finbank/onboarding:1.0.0
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    env_file: .env
    environment:
      DATABASE_URL: postgres://finbank:${POSTGRES_PASSWORD}@db:5432/finbank
    ports: ["8080:8080"]
    volumes: [docs:/data/docs]
  # one-off: docker compose run --rm seed   (demo data by default; set SEED_DEMO=false for reference data only)
  seed:
    image: finbank/onboarding:1.0.0
    profiles: [tools]
    depends_on: { db: { condition: service_healthy } }
    env_file: .env
    environment: { DATABASE_URL: "postgres://finbank:${POSTGRES_PASSWORD}@db:5432/finbank" }
    volumes: [docs:/data/docs]
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/db/seed.js"]
volumes: { pgdata: {}, docs: {} }
